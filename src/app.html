<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Decide before first paint whether the intro plays, so repeat visits never flash it.
			// `nv-anim` marks "JS + motion allowed": hero elements stay hidden until their intro runs.
			(function () {
				var d = document.documentElement;
				try {
					if (localStorage.getItem('nv-theme') === 'light') d.dataset.theme = 'light';
				} catch (e) {}
				var reduced = false;
				try {
					reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
					if (sessionStorage.getItem('nv-intro') || reduced) d.dataset.intro = 'skip';
				} catch (e) {
					d.dataset.intro = 'skip';
				}
				if (!reduced) d.classList.add('nv-anim');
			})();
		</script>
		<noscript><style>.preloader{display:none!important}</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
