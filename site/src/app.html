<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Decide before first paint whether the intro plays, so repeat visits never flash it.
			try {
				if (
					sessionStorage.getItem('nv-intro') ||
					matchMedia('(prefers-reduced-motion: reduce)').matches
				) {
					document.documentElement.dataset.intro = 'skip';
				}
			} catch (e) {
				document.documentElement.dataset.intro = 'skip';
			}
		</script>
		<noscript><style>.preloader{display:none!important}.hero{height:auto!important}.hero-stage{position:relative!important}.about-frame{position:relative!important;height:auto!important}.about-title{--reveal:1!important}.hero-in{opacity:1!important;translate:none!important}</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
